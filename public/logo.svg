<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <!-- Vintage textured background suggestion -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d4b8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Text with Retro Styling -->
  <text x="200" y="90" font-family="Georgia, serif" font-size="72" font-weight="bold" text-anchor="middle" fill="url(#textGradient)" stroke="#5a3a2a" stroke-width="2" filter="url(#shadow)">
    FaithFeast
  </text>

  <!-- Decorative wavy underline in retro colors -->
  <path d="M 80 110 Q 100 120, 120 110 T 160 110 T 200 110 T 240 110 T 280 110 T 320 110" 
        stroke="#d4a574" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Retro color accent stripes -->
  <rect x="75" y="115" width="250" height="4" fill="#a83e48"/>
  <rect x="75" y="122" width="250" height="3" fill="#2c5aa0"/>
  <rect x="75" y="128" width="250" height="3" fill="#d4a574"/>
  <rect x="75" y="134" width="250" height="3" fill="#7fb069"/>
</svg>